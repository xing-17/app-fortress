[project]
name = "app-fortress"
version = "1.0.0"
description = "Fortress station for global data assets."
readme = "README.md"
authors = [
    { name = "Xing Xing", email = "x.xing.life@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    # ---------- System Dependencies ----------
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "polars",
    "duckdb",

    # ---------- Source Dependencies ----------
    "tushare"
]

[project.optional-dependencies]
aliyun = [
    "alibabacloud-oss-v2",
    "alibabacloud-tea-openapi",
    "alibabacloud-credentials>=1.0,<2"
]
dev = [
    "pytest",
    "pytest-benchmark",
    "ruff"
]

[build-system]
requires = [
    "setuptools"
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["logs*", "tests*"]

[tool.ruff]
line-length = 120
target-version = "py311"
fix = true

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E402"]

[tool.ruff.lint.isort]
force-single-line = false

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["app"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
