[project]
name = "lib-bastion"
version = "0.0.1"
description = "Lightweight pylib for managing data pipeline ecosystems."
readme = "README.md"
authors = [
    { name = "Xing Xing", email = "x.xing.work@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.34",
    "tenacity>=8.0",
]
aliyun = [
    "oss2>=2.18",
    "alibabacloud-fc20230330",
    "tenacity>=8.0",
]
inspect = [
    "duckdb>=0.10",
]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.0",
    "moto[dynamodb,glue,lambda,s3]>=5.0",
    "ruff>=0.13",
    "setuptools",
    "wheel",
    "twine",
    "build",
]

[build-system]
requires = [
  "setuptools",
  "wheel",
  "twine",
  "build"
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["bastion*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"
fix = true

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = false
