# --------------------------------------------------------------
# Fortress System Configuration
# --------------------------------------------------------------

# ---------- Basic Information ----------
name: fortress
version: "6.0.0"
alias: "..."
env: "prod"                           # PROD, TEST, DEV | 默认PROD
timezone: "Asia/Shanghai"             # 应用时区

# ---------- Logging Configuration ----------
log_level: "debug"                    # 日志级别，默认为debug
log_format: "COLORTEXT"               # TEXT, JSON | 默认TEXT
log_path: ".logs/"                    # 日志目录路径，默认为标准输出
log_file_max_mb: 10                   # 日志文件最大大小，单位MB，默认为100MB
log_group_max_len: 10000              # 日志分组最大长度，默认为10000
