# --------------------------------------------------------------
# Fortress Dbt Configuration
# --------------------------------------------------------------

# Connection Name 
target: prod

# Dbt Profile settings
path: .cache/centre/centre.duckdb
threads: 1
extensions:
  - httpfs
settings:
  memory_limit: '12GB'
  max_temp_directory_size: '20GB'
  enable_object_cache: true
  preserve_insertion_order: false
