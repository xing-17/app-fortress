name: tushare_stock_capflow
provider_type: tushare
method: moneyflow
strategy: by_tradedate
partition:
  prefix: date
  column: "trade_date"
paginate:
  page_size: 6000
  max_pages: 10
coolant:
  interval: 0
retry:
  max_retries: 2
  interval: 30
  backoff_rate: 1
  ignore_patterns:
    - "不存在"
params:
  - trade_date
extra:
  include_fields: true
quality_enabled: true
fields:
  - name: ts_code
    type: Utf8
    description: 股票代码
    is_primary: true
  - name: trade_date
    type: Date
    description: 交易日期
    is_primary: true
  - name: buy_sm_vol
    type: Float64
    description: 小单买入量 (手)
  - name: buy_sm_amount
    type: Float64
    description: 小单买入额 (万元)
  - name: sell_sm_vol
    type: Float64
    description: 小单卖出量 (手)
  - name: sell_sm_amount
    type: Float64
    description: 小单卖出额 (万元)
  - name: buy_md_vol
    type: Float64
    description: 中单买入量 (手)
  - name: buy_md_amount
    type: Float64
    description: 中单买入额 (万元)
  - name: sell_md_vol
    type: Float64
    description: 中单卖出量 (手)
  - name: sell_md_amount
    type: Float64
    description: 中单卖出额 (万元)
  - name: buy_lg_vol
    type: Float64
    description: 大单买入量 (手)
  - name: buy_lg_amount
    type: Float64
    description: 大单买入额 (万元)
  - name: sell_lg_vol
    type: Float64
    description: 大单卖出量 (手)
  - name: sell_lg_amount
    type: Float64
    description: 大单卖出额 (万元)
  - name: buy_elg_vol
    type: Float64
    description: 超大单买入量 (手)
  - name: buy_elg_amount
    type: Float64
    description: 超大单买入额 (万元)
  - name: sell_elg_vol
    type: Float64
    description: 超大单卖出量 (手)
  - name: sell_elg_amount
    type: Float64
    description: 超大单卖出额 (万元)
  - name: net_mf_vol
    type: Float64
    description: 净流入量 (手)
  - name: net_mf_amount
    type: Float64
    description: 净流入额 (万元)
tags:
  name: tushare_stock_capflow
  region: cn
  provider: tushare
  domain: stock
  subdomain: capflow
  frequency: day
  position: after_market
